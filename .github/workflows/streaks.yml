name: TT Elite streaks

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Fecha de inicio (YYYY-MM-DD)"
        required: true
      end:
        description: "Fecha de fin (YYYY-MM-DD)"
        required: true
      max_bucket:
        description: "Longitud de racha desde la que se agrupa como 'N+'"
        default: "6"
      full_model:
        description: "Comparar tambien contra el modelo completo (Elo+session_delta+h2h+rivales comunes)"
        type: boolean
        default: false

jobs:
  streaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rachas
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          ARGS="--start ${{ inputs.start }} --end ${{ inputs.end }} --max-bucket ${{ inputs.max_bucket }}"
          if [ "${{ inputs.full_model }}" = "true" ]; then ARGS="$ARGS --full-model"; fi
          python -m tt_elite.cli streaks $ARGS
