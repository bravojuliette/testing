name: TT Elite streaks

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Fecha de inicio (YYYY-MM-DD)"
        required: true
      end:
        description: "Fecha de fin (YYYY-MM-DD)"
        required: true
      max_bucket:
        description: "Longitud de racha desde la que se agrupa como 'N+'"
        default: "6"

jobs:
  streaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rachas
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m tt_elite.cli streaks --start ${{ inputs.start }} --end ${{ inputs.end }} --max-bucket ${{ inputs.max_bucket }}
