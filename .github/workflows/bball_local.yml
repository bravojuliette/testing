name: BBall local (recolecta de BetsAPI a SQLite local, sin Turso)

# Nacido del bloqueo de cuota de LECTURAS de Turso (2026-08): este job corre
# el CLI SIN los secrets de Turso, asi que db.connect() cae a data/bball.db
# local del runner. Al final exporta un volcado compacto y lo commitea .gz en
# la rama -- ese fichero es el canal de vuelta hacia la sesion de trabajo.
# La base completa (con la cache cruda de respuestas) sube como artefacto por
# si hiciera falta un reparse sin re-llamar a BetsAPI.

on:
  workflow_dispatch:
    inputs:
      args:
        description: "Comandos para 'python -m bball.cli', separados por ';' (ej: collect --start 2024-10-01 --end 2026-06-30 --leagues NBA; backfill-hist --leagues NBA)"
        required: true
      publish:
        description: "Ruta del volcado compacto .gz a commitear en la rama (vacio = no publicar)"
        required: false
        default: ""

permissions:
  contents: write

# Cola en serie: varios lanzamientos comparten el rate-limit del token de
# BetsAPI y no ganan nada corriendo en paralelo.
concurrency:
  group: bball-local
  cancel-in-progress: false

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Run (sin Turso -- todo va a data/bball.db del runner)
        env:
          PYTHONUNBUFFERED: "1"
          BETSAPI_TOKEN_BBALL: ${{ secrets.BETSAPI_TOKEN_BBALL || secrets.BETSAPI_TOKEN }}
        run: |
          IFS=';' read -ra CMDS <<< "${{ inputs.args }}"
          for c in "${CMDS[@]}"; do
            echo "== python -m bball.cli $c"
            python -m bball.cli $c
          done

      - name: Publicar volcado compacto en la rama
        if: ${{ inputs.publish != '' }}
        run: |
          python -m bball.cli export-compact --out /tmp/compact.db
          mkdir -p "$(dirname '${{ inputs.publish }}')"
          gzip -9 -c /tmp/compact.db > "${{ inputs.publish }}"
          ls -lh "${{ inputs.publish }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.publish }}"
          git commit -m "datos: ${{ inputs.publish }} (recoleccion local BetsAPI)"
          for i in 1 2 3 4; do
            git push && break
            git pull --rebase --autostash || true
            sleep $((2 ** i))
          done

      - name: Subir base completa (cache cruda incluida) como artefacto
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ -f data/bball.db ]; then gzip -9 -c data/bball.db > /tmp/bball_full.db.gz; fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: bball-local-full-${{ github.run_id }}
          path: /tmp/bball_full.db.gz
          retention-days: 5
          if-no-files-found: ignore
