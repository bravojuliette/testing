name: BBall discover (exploracion BetsAPI basketball)

on:
  workflow_dispatch:
    inputs:
      args:
        description: "Argumentos para 'python -m bball.cli' (ej: discover-leagues, o: raw /v3/events/ended --params sport_id=18,day=20260827)"
        required: true
        default: "discover-leagues"

jobs:
  discover:
    runs-on: ubuntu-latest
    # Generoso a proposito para collects de rangos largos -- resumible via
    # bball_http_cache si se corta (mismo criterio que collect.yml de tt_elite).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Run
        env:
          PYTHONUNBUFFERED: "1"
          # Mismo token que tt_elite (confirmado por el usuario) -- BETSAPI_TOKEN_BBALL
          # queda como override opcional si en el futuro BetsAPI separa el producto.
          BETSAPI_TOKEN_BBALL: ${{ secrets.BETSAPI_TOKEN_BBALL || secrets.BETSAPI_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m bball.cli ${{ inputs.args }}
