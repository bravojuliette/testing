name: TT Elite live scan

on:
  schedule:
    # Cada 10 minutos. GitHub puede retrasar cron bajo carga alta; es normal.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run_email:
        description: "No enviar email, solo calcular y guardar"
        type: boolean
        default: false
      test_email:
        description: "En vez de escanear, solo manda un email de prueba via SendGrid"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tt-elite-live-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Scan en vivo
        env:
          PYTHONUNBUFFERED: "1"
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python -m tt_elite.cli test-email
          else
            ARGS=""
            if [ "${{ inputs.dry_run_email }}" = "true" ]; then ARGS="--dry-run-email"; fi
            python -m tt_elite.cli scan $ARGS
          fi

      - name: Cadenas de barridas transitivas (sistema aparte, sin picks)
        # No depende del paso anterior ni de BetsAPI: solo relee raw_matches
        # ya guardado en Turso. Corre siempre -- incluso si el scan de arriba
        # falla -- salvo que este workflow_dispatch sea solo para probar el
        # email (test_email=true).
        if: ${{ always() && inputs.test_email != 'true' }}
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m tt_elite.cli scan-blowout-chain
