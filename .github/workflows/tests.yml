name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tt_elite/tests -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Variables placeholder: solo se compila, no se conecta a nada real.
      - run: npx next build
        env:
          TURSO_DATABASE_URL: "libsql://placeholder.turso.io"
          APP_PASSWORD: "placeholder"
          GITHUB_TOKEN: "placeholder"
          GITHUB_OWNER: "placeholder"
          GITHUB_REPO: "placeholder"
