name: TT Elite collect

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Fecha de inicio (YYYY-MM-DD)"
        required: true
      end:
        description: "Fecha de fin (YYYY-MM-DD)"
        required: true
      no_odds:
        description: "Solo partidos/resultados, sin cuotas (mas rapido)"
        type: boolean
        default: false
  schedule:
    # Diario a las 05:00 UTC -- sin inputs (schedule no los admite), asi que
    # el propio job calcula un rango rodante de los ultimos 5 dias. Barato:
    # collect_range ya es resumible/idempotente, los dias ya completos se
    # saltan rapido, solo tarda lo que tarden los dias realmente nuevos.
    - cron: "0 5 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    # Un año completo con cuotas puede tardar bastante por el rate-limit de
    # BetsAPI (~1 req/s) -- generoso a proposito, es resumible si se corta.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Collect
        env:
          # Sin esto, el stdout de Python se queda en un buffer interno y no
          # se ve en el log de Actions hasta que el proceso termina -- parece
          # colgado aunque este avanzando con normalidad.
          PYTHONUNBUFFERED: "1"
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          START="${{ inputs.start }}"
          END="${{ inputs.end }}"
          if [ -z "$START" ]; then START=$(date -u -d '5 days ago' +%Y-%m-%d); fi
          if [ -z "$END" ]; then END=$(date -u +%Y-%m-%d); fi
          ARGS="--start $START --end $END"
          if [ "${{ inputs.no_odds }}" = "true" ]; then ARGS="$ARGS --no-odds"; fi
          python -m tt_elite.cli collect $ARGS
